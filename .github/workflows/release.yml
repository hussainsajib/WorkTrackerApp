name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # "dir" builds only dist/win-unpacked (no installer or portable exe),
      # matching the folder-based distribution used locally.
      - run: npx electron-builder --win dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Zip the build
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          Compress-Archive -Path dist/win-unpacked/* -DestinationPath "WorkTracker-$name-win.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: WorkTracker-win
          path: WorkTracker-*-win.zip

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: WorkTracker-*-win.zip
          generate_release_notes: true
